name: hunt

on:
  schedule:
    # Every hour at minute 17 (UTC). Each run scrapes one shard of the grid.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "auto, all, or a shard number"
        default: "auto"
      test_alert:
        description: "Only send a test alert to every configured channel"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore price history from the data branch
        run: |
          mkdir -p data
          if git fetch --depth 1 origin data 2>/dev/null; then
            git show FETCH_HEAD:hunter.sqlite > data/hunter.sqlite && echo "restored $(du -h data/hunter.sqlite)"
          elif [ -f data/hunter.sqlite ]; then
            echo "no data branch yet; using the copy committed on main"
          fi

      - run: python -m pytest -q

      - name: Test alert
        if: ${{ github.event.inputs.test_alert == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python -m hunter test-alert

      - name: Scrape, scan deals, analyze, alert
        if: ${{ github.event.inputs.test_alert != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python -m hunter run --shard "${{ github.event.inputs.shard || 'auto' }}"

      - name: Save report on main and price history on the data branch
        if: always() && github.event.inputs.test_alert != 'true'
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "flight-hunter-bot"
          git config user.email "flight-hunter-bot@users.noreply.github.com"
          git add reports/latest.md || true
          git rm --cached --quiet data/hunter.sqlite 2>/dev/null || true
          git diff --cached --quiet || git commit -m "report: $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase --autostash || true
          git push || true
          # The database lives alone on an orphan branch that is force-pushed every run,
          # so git history does not keep a copy of every version.
          if [ -f data/hunter.sqlite ]; then
            tmp=$(mktemp -d); cp data/hunter.sqlite "$tmp/"; cd "$tmp"
            git init -q -b data && git add hunter.sqlite
            git -c user.name="flight-hunter-bot" -c user.email="flight-hunter-bot@users.noreply.github.com" commit -qm "price history $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" data
            echo "database saved: $(du -h hunter.sqlite)"
          fi
