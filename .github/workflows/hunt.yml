name: hunt

on:
  schedule:
    # Every 3 hours at minute 17 (UTC). Each run scrapes one shard of the grid.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      shard:
        description: "auto, all, or a shard number"
        default: "auto"
      test_alert:
        description: "Only send a test alert to every configured channel"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - name: Test alert
        if: ${{ github.event.inputs.test_alert == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python -m hunter test-alert

      - name: Scrape, scan deals, analyze, alert
        if: ${{ github.event.inputs.test_alert != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python -m hunter run --shard "${{ github.event.inputs.shard || 'auto' }}"

      - name: Save price history and report
        if: always()
        run: |
          git config user.name "flight-hunter-bot"
          git config user.email "flight-hunter-bot@users.noreply.github.com"
          git add data/hunter.sqlite reports/latest.md || true
          git diff --cached --quiet || git commit -m "data: sweep $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase --autostash || true
          git push || true
